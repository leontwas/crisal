<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Crisal Consultora</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="stylesheet" href="./assets/css/fuentes.css?v=2.0">
    <link rel="stylesheet" href="./assets/css/login.css?v=2.0">
</head>
<body>
    <div class="form-container">
        <a href="index.html">
            <img src="./assets/images/login2.webp" alt="Logo de acceso de administrador" id="login">
        </a>
        <h3>Panel de Administración</h3>
        <form id="loginForm">
            <div class="input-box">
                <input type="text" id="username" placeholder=" " required autocomplete="username">
                <span class="pass">Usuario</span>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                <span class="pass">Contraseña</span>
            </div>
            <div class="box-visible">
                <input type="checkbox" id="visible">
                <label for="visible">Mostrar Contraseña</label>
            </div>
            <button type="submit" class="submit-btn">Iniciar Sesión</button>
            <div class="box-visible">
                <a href="index.html">← Volver al sitio web</a>
            </div>
        </form>
    </div>
    <script src="./assets/js/login.js"></script>
</body>
</html>
